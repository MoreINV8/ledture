<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <!-- Background / Icon Container Gradient -->
    <linearGradient id="ledture-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D294" />
      <stop offset="100%" stop-color="#00A876" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="ledture-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D294" />
      <stop offset="100%" stop-color="#FF2A5F" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D294" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Icon Mark (Badge Container) -->
  <g transform="translate(10, 10)">
    <!-- Rounded Container -->
    <rect x="0" y="0" width="120" height="120" rx="30" fill="#172033" stroke="#334155" stroke-width="2" />

    <!-- Dynamic "L" + Lightning Speed Chevron Geometry -->
    <g filter="url(#shadow)">
      <!-- Vertical stem of "L" morphing into dynamic upward arrow -->
      <path d="M 38 32 C 38 29.79 39.79 28 42 28 L 50 28 C 52.21 28 54 29.79 54 32 L 54 74 L 80 74 C 82.21 74 84 75.79 84 78 L 84 86 C 84 88.21 82.21 90 80 90 L 42 90 C 39.79 90 38 88.21 38 86 Z" fill="url(#ledture-green-grad)" />
      
      <!-- Forward/Upward Fast-Tracking Chevron Accent -->
      <path d="M 60 34 L 74 48 L 68 48 L 54 34 Z" fill="#00D294" opacity="0.6" />
      <path d="M 72 46 L 86 60 L 78 60 L 64 46 Z" fill="#FF2A5F" />
    </g>
  </g>

  <!-- Typography -->
  <!-- "Led" in crisp modern white -->
  <text x="155" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Led<tspan fill="url(#ledture-green-grad)">ture</tspan></text>
  
  <!-- Subtitle Tagline -->
  <text x="157" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1.5">LEDGER FOR FUTURE</text>
</svg>
