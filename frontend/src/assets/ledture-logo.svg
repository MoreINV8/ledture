<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Primary Accent Gradient (Income / Save Emerald) -->
    <linearGradient id="primary-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E6A3" />
      <stop offset="100%" stop-color="#00A876" />
    </linearGradient>

    <!-- Secondary Accent Gradient (Expense Pink) -->
    <linearGradient id="accent-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A5F" />
      <stop offset="100%" stop-color="#D91B4E" />
    </linearGradient>

    <!-- Glowing Drop Shadow for Depth -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00D294" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Icon Badge Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" stroke="#334155" stroke-width="6" />

  <!-- Integrated "L" + Speed Chevron Geometry -->
  <g filter="url(#emerald-glow)">
    <!-- Base "L" Structure -->
    <path d="M 160 128 
             C 160 114.746 170.746 104 184 104 
             L 216 104 
             C 229.254 104 240 114.746 240 128 
             L 240 312 
             L 328 312 
             C 341.254 312 352 322.746 352 336 
             L 352 368 
             C 352 381.254 341.254 392 328 392 
             L 184 392 
             C 170.746 392 160 381.254 160 368 
             Z" 
          fill="url(#primary-green)" />

    <!-- Upper Trend/Speed Arrow (Fast-Forward Accent) -->
    <path d="M 280 136 
             L 344 200 
             L 316 200 
             L 252 136 
             Z" 
          fill="#00D294" 
          opacity="0.5" />

    <path d="M 328 184 
             L 392 248 
             L 364 248 
             L 300 184 
             Z" 
          fill="url(#accent-pink)" />
  </g>
</svg>
