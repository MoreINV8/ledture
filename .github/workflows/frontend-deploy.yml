name: Frontend Deployment

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        -   name: Checkout
            uses: actions/checkout@v6

        -   name: Setup Node
            uses: actions/setup-node@v6
            with:
                node-version: 24

        -   name: Install dependencies
            working-directory: frontend
            run: npm ci

        -   run: echo ${{ env.BASE_API_URL }} ${{ vars.BASE_API_URL }}

        -   name: Build
            working-directory: frontend
            env:
                VITE_BASE_API_URL: ${{ env.BASE_API_URL }}
            run: npm run build

        -   name: Setup Pages
            uses: actions/configure-pages@v5

        -   name: Upload artifact
            uses: actions/upload-pages-artifact@v4
            with:
                path: frontend/dist

        -   name: Deploy
            uses: actions/deploy-pages@v4